<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Role view</title>
<!-- Prototype only: never imported by the app. People and extra photos are samples. -->
<style>
  :root { --ink: #171717; --muted: #6b6b70; --line: #e7e5e4; --soft: #f6f5f3; --gold: #cd9f5b; --gold-soft: #f6ead3; --navy: #0d345e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 "Geist Variable", system-ui, sans-serif; color: var(--ink); background: #ececee; }
  button { font: inherit; color: inherit; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e4e4e7; }
  .bar strong { margin-right: 6px; }
  .bar button { border: 1px solid #d4d4d8; background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .bar button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .note { margin: 0; padding: 8px 16px 0; color: var(--muted); }

  .app { display: flex; gap: 12px; padding: 10px 16px 16px; height: calc(100vh - 92px); min-height: 560px; }
  .panel { flex: none; width: 270px; background: #fff; border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
  .panel-head { padding: 12px 14px; border-bottom: 1px solid #f0efed; font-weight: 600; }
  .list { overflow: auto; padding: 6px; }
  .list .group { margin: 8px 8px 4px; color: #5b5b61; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .role-row { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .role-row:hover { background: var(--soft); }
  .role-row.on { background: var(--gold-soft); }
  .role-row b { display: block; }
  .role-row span { color: var(--muted); font-size: 12.5px; }
  .main { flex: 1; min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: auto; }

  .ghost { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .ghost:hover { background: var(--soft); }
  .current { background: #e7f6ec; color: #1f7a3d; border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 600; }
  .link { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; text-decoration: none; color: var(--ink); }
  .link:hover { background: var(--soft); }
  .link svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  .meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  /* A: hero + tabs */
  .hero { height: 170px; background: #d8d2c8 center/cover no-repeat; position: relative; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.45)); }
  .hero-copy { position: absolute; left: 24px; right: 24px; bottom: 16px; color: #fff; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .hero-copy h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  .hero-copy p { margin: 2px 0 0; opacity: .92; }
  .hero-copy .ghost { background: rgba(255,255,255,.92); color: var(--ink); }
  .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 24px; border-bottom: 1px solid #f0efed; }
  .strip .meta { margin-right: auto; }
  .tabs { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid #f0efed; overflow-x: auto; }
  .tabs button { border: 0; background: none; padding: 11px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); font-weight: 600; }
  .tabs .n { color: #8a6d4f; font-weight: 600; margin-left: 4px; }
  .pane { padding: 18px 24px 28px; max-width: 860px; }

  /* B: header + tiles */
  .head { display: flex; gap: 16px; align-items: center; padding: 20px 24px 16px; }
  .thumb { width: 84px; height: 84px; border-radius: 14px; background: #d8d2c8 center/cover no-repeat; flex: none; }
  .head h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
  .head p { margin: 2px 0 0; }
  .head .spacer { margin-left: auto; align-self: flex-start; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; padding: 0 24px 16px; }
  .tile { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; min-height: 92px; }
  .tile:hover { border-color: #ead5ad; background: #fffcf6; }
  .tile.on { border-color: var(--gold); background: #fffaf0; box-shadow: 0 0 0 1px var(--gold) inset; }
  .tile b { font-size: 22px; }
  .tile span { color: var(--muted); font-size: 13px; }
  .tile small { color: #3f3f46; }
  .detail { margin: 0 24px 24px; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }

  /* C: two columns */
  .cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr); gap: 18px; padding: 20px 24px 28px; align-items: start; }
  .story-card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .story-card .cover { height: 150px; background: #d8d2c8 center/cover no-repeat; }
  .story-card .copy { padding: 14px 16px 16px; }
  .story-card h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
  .side { display: grid; gap: 10px; }
  .side-box { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .side-box h3 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; }
  .side-box h3 button { border: 0; background: none; color: #8a6d4f; cursor: pointer; font-size: 13px; }

  /* Recommended: compact banner, section tiles, and the Recent panel on the right */
  .recent { display: none; flex: none; width: 300px; background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; flex-direction: column; }
  .with-recent .recent { display: flex; }
  .with-recent .panel { width: 240px; }
  .seg { display: flex; gap: 2px; margin: 10px; padding: 3px; background: var(--soft); border-radius: 10px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 6px; cursor: pointer; color: var(--muted); }
  .seg button[aria-selected="true"] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .recent-scope { margin: 0 12px 6px; color: var(--muted); font-size: 12.5px; }
  .recent-list { overflow: auto; padding: 0 12px 12px; display: grid; gap: 8px; align-content: start; }
  .recent-list { gap: 0; }
  .entry { padding: 10px 2px; border-bottom: 1px solid #f0efed; }
  .entry:last-child { border-bottom: 0; }
  .entry b { display: block; font-size: 13px; }
  .entry p { margin: 2px 0; color: #3f3f46; font-size: 13px; }
  .entry small { color: var(--muted); }
  .compose { margin: 0 12px 12px; display: flex; gap: 6px; }
  .seg button { padding: 6px 4px; font-size: 13px; }
  .log { list-style: none; margin: 0; padding: 0 12px 12px; overflow: auto; }
  .log li { position: relative; padding: 0 0 14px 18px; }
  .log li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
  .log li::after { content: ""; position: absolute; left: 7px; top: 15px; bottom: 0; width: 1px; background: #ebe7e1; }
  .log li:last-child::after { display: none; }
  .log b { display: block; font-size: 13px; }
  .log p { margin: 2px 0; color: #3f3f46; font-size: 12.5px; }
  .log small { color: var(--muted); }
  .hist-switch { display: flex; gap: 6px; margin: 0 12px 8px; }
  .hist-switch button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
  .hist-switch button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .years { overflow: auto; padding: 0 12px 12px; display: grid; gap: 8px; align-content: start; }
  .year { border: 1px solid var(--line); border-radius: 12px; }
  .year > button { width: 100%; display: flex; align-items: baseline; gap: 8px; border: 0; background: none; padding: 10px 12px; cursor: pointer; text-align: left; }
  .year > button b { font-size: 16px; }
  .year > button span { color: var(--muted); font-size: 12.5px; margin-right: auto; }
  .year > button i { font-style: normal; color: #8a6d4f; font-size: 12.5px; font-weight: 600; }
  .year ol { list-style: none; margin: 0; padding: 0 12px 10px; display: grid; gap: 8px; }
  .year li { display: grid; grid-template-columns: 30px 1fr; gap: 2px 8px; font-size: 13px; }
  .year li small { color: var(--muted); }
  .year li .k { grid-column: 2; color: #8a6d4f; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .year li .t { grid-column: 2; }
  .year li small { grid-row: 1 / span 2; padding-top: 2px; }
  .log .undo { border: 0; background: none; color: #8a6d4f; cursor: pointer; padding: 0; font-size: 12.5px; margin-left: 6px; }
  .compose input { flex: 1; font: inherit; padding: 7px 9px; border: 1px solid #d4d4d8; border-radius: 8px; }
  .hero.slim { height: 128px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; padding: 14px 24px 4px; }
  .chip { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 11px; cursor: pointer; display: grid; gap: 1px; }
  .chip:hover { border-color: #ead5ad; background: #fffcf6; }
  .chip.on { border-color: var(--gold); background: #fffaf0; box-shadow: 0 0 0 1px var(--gold) inset; }
  .chip span { color: var(--muted); font-size: 12.5px; }
  .chip b { font-size: 18px; }
  .jump { position: sticky; top: 0; z-index: 2; display: flex; gap: 16px; padding: 10px 24px; background: rgba(255,255,255,.96); border-bottom: 1px solid #f0efed; overflow-x: auto; }
  .jump a { color: var(--muted); text-decoration: none; white-space: nowrap; font-size: 13.5px; }
  .jump a:hover { color: var(--ink); }
  .jump .n { color: #8a6d4f; font-weight: 600; }
  .onepage { padding-bottom: 8px; border-bottom: 1px solid #f3f1ee; margin-bottom: 14px; scroll-margin-top: 48px; }
  .onepage:last-child { border-bottom: 0; }
  .hero.d { height: 168px; }
  .hero.d .hero-copy > div:first-child { min-width: 0; }
  .hero.d h1 { font-size: clamp(19px, 2.2vw, 26px); line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hero.d .hero-copy p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero.d .hero-btns { flex: none; }
  .hero.cream { background: linear-gradient(180deg, #fbf6ee, #f4ecdf); }
  .hero.cream::after { display: none; }
  .hero.cream .hero-copy { color: var(--ink); }
  .hero.cream .glass, .hero.cream .round { background: #fff; box-shadow: 0 0 0 1px #eadfcd inset; }
  .hp-head { display: flex; gap: 10px; align-items: center; padding: 14px 14px 10px; border-bottom: 1px solid #f0efed; background: linear-gradient(180deg, #fdfaf4, #fff); }
  .hp-head b { display: block; font-size: 15px; }
  .hp-head small { color: var(--muted); }
  .hp-mark span { display: block; width: 34px; height: 34px; border-radius: 10px; background: #d8d2c8 center/cover no-repeat; }
  .hp-mark .cream-dot { background: linear-gradient(180deg, #fbf6ee, #f1e6d4); color: #8a6d4f; display: grid; place-items: center; font-weight: 700; box-shadow: 0 0 0 1px #eadfcd inset; }
  .hp-tools { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 10px 12px; }
  .hp-search { display: flex; align-items: center; gap: 6px; border: 1px solid #d9d9de; border-radius: 10px; padding: 0 8px; height: 32px; min-width: 0; }
  .hp-search svg { width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; flex: none; }
  .hp-search input { border: 0; outline: 0; font: inherit; min-width: 0; width: 100%; background: none; }
  .hp-tools select { font: inherit; border: 0; background: none; padding: 4px 2px; cursor: pointer; color: var(--ink); field-sizing: content; }
  .hp-list { overflow: auto; flex: 1; }
  .hp-empty { margin: 0 12px; }
  .hist-title { display: flex; align-items: baseline; gap: 8px; padding: 14px 12px 8px; }
  .hist-title span { color: var(--muted); font-size: 12.5px; }
  .hist-switch.wrap { flex-wrap: wrap; }
  .compose.stack { display: grid; gap: 6px; margin-top: auto; padding-top: 10px; border-top: 1px solid #f0efed; margin-left: 0; margin-right: 0; padding-left: 12px; padding-right: 12px; }
  .compose .kind { display: flex; gap: 4px; }
  .compose .kind button { border: 0; background: none; color: var(--muted); padding: 2px 8px; border-radius: 999px; cursor: pointer; font-size: 12.5px; }
  .compose .kind button[aria-pressed="true"] { background: var(--soft); color: var(--ink); font-weight: 600; }
  .hero-icons { position: absolute; top: 12px; right: 14px; z-index: 1; display: flex; gap: 6px; }
  .round { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.9); color: var(--ink); }
  .round svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.3; }
  .hero-btns { display: flex; gap: 6px; }
  .glass { white-space: nowrap; border: 0; background: rgba(255,255,255,.92); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .glass:hover { background: #fff; }
  .pop-wrap { position: relative; margin-left: auto; }
  .faces { display: flex; align-items: center; border: 0; background: none; cursor: pointer; padding: 2px 4px; border-radius: 999px; }
  .faces:hover { background: var(--soft); }
  .face { width: 28px; height: 28px; border-radius: 50%; background: var(--gold-soft); color: #8a6d4f; display: grid; place-items: center; font-size: 11px; font-weight: 600; border: 2px solid #fff; margin-left: -8px; }
  .face:first-child { margin-left: 0; }
  .faces > span:last-child { margin-left: 8px; color: #3f3f46; font-size: 13px; }
  .pop { position: absolute; right: 0; top: calc(100% + 6px); width: 300px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.14); padding: 12px; z-index: 5; }
  .tabs.two { gap: 10px; }
  .d-sec { margin-top: 22px; padding-top: 16px; border-top: 1px solid #f0efed; }
  .d-sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .d-sec-head h3 { margin: 0; font-size: 15px; }
  .textbtn { border: 0; background: none; color: #8a6d4f; cursor: pointer; font-size: 13px; padding: 0; }
  .strip-photos { display: flex; gap: 8px; overflow-x: auto; }
  .ph { flex: none; width: 128px; aspect-ratio: 4/3; border-radius: 10px; border: 0; background: #d8d2c8 center/cover no-repeat; cursor: pointer; }
  .ph.add { background: var(--soft); color: var(--muted); font-size: 22px; border: 1px dashed #d6d0c6; }
  .events { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .events b { color: #8a6d4f; font-size: 12.5px; margin-right: 6px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
  .place-row { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: start; }
  .map.mini { height: 110px; }
  .ach-list { margin: 0 0 12px; padding-left: 20px; display: grid; gap: 10px; }
  .ach-list li span { margin-right: 8px; }
  .proof { border: 1px dashed #d6d0c6; background: none; color: var(--muted); border-radius: 999px; padding: 1px 8px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .proof.has { border-style: solid; border-color: #ead5ad; background: var(--gold-soft); color: #8a6d4f; }
  .gallery { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 20; }
  .gallery-inner { width: min(900px, 92vw); max-height: 86vh; overflow: auto; background: #fff; border-radius: 16px; padding: 16px; }
  .gallery-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .photos.big { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .summary-line { margin: 0; padding: 12px 24px 0; }

  /* shared content */
  h3.sec { margin: 18px 0 8px; font-size: 15px; }
  h3.sec:first-child { margin-top: 0; }
  ul.ach { margin: 0; padding-left: 18px; display: grid; gap: 7px; }
  .people { display: grid; gap: 8px; }
  .person { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--gold-soft); color: #8a6d4f; display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
  .person small { color: var(--muted); display: block; }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .photos div { aspect-ratio: 4/3; border-radius: 10px; background: #d8d2c8 center/cover no-repeat; }
  dl.facts { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; }
  .empty { color: var(--muted); }
  .map { height: 160px; border-radius: 10px; background: linear-gradient(135deg, #e8eef0, #dfe7df); position: relative; }
  .map b { position: absolute; left: 55%; top: 45%; width: 14px; height: 14px; border-radius: 50%; background: var(--navy); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  form.edit { display: grid; gap: 10px; max-width: 620px; }
  form.edit label { display: grid; gap: 4px; font-size: 13px; color: #3f3f46; }
  form.edit input, form.edit textarea { font: inherit; padding: 7px 9px; border: 1px solid #d4d4d8; border-radius: 8px; }
  form.edit .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .primary { background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
</style>
</head>
<body>
  <div class="bar">
    <strong>Layout</strong>
    <button data-layout="d" aria-pressed="true">D · Banner, buttons, two tabs</button>
    <button data-layout="r" aria-pressed="false">R1 · Text tabs</button>
    <button data-layout="s" aria-pressed="false">R2 · One page</button>
    <button data-layout="a" aria-pressed="false">A · Banner and tabs</button>
    <button data-layout="b" aria-pressed="false">B · Header and tiles</button>
    <button data-layout="c" aria-pressed="false">C · Story and side boxes</button>
  </div>
  <p class="note" id="note"></p>
  <div class="app">
    <aside class="panel"><div class="panel-head">Career history</div><div class="list" id="list"></div></aside>
    <main class="main" id="main"></main>
    <aside class="recent" id="recent"></aside>
  </div>

<script>
const COVER = "/api/work-map/media/c656800b-bb76-4779-99d6-9a0ebc251f28";
const ROLES = [
  ["Giants Direct", "Mechatronics and Robotics Technician", "Jun 2024 – Present"],
  ["Sharp Packaging", "Systems and Automation Technician", "Jan 2023 – Present"],
  ["Waters Corp. TA Instruments", "Manufacturing Engineering Technician", "Mar 2022 – Sep 2022"],
  ["Temple University", "Researcher, Temple Material Institute", "May 2021 – Aug 2021"],
  ["Rowa Group LLC", "Technical Support Engineer", "Aug 2020 – Dec 2021"],
  ["Amazon", "Package Handler", "Oct 2017 – Feb 2018"],
];
const GIANTS = {
  cover: COVER, story: true, years: true,
  company: "Giants Direct", title: "Mechatronics and Robotics Technician", place: "Lancaster, PA",
  dates: "Jun 2024 – Present", current: true, tenure: "2y 5m",
  summary: "Maintained Swisslog pick-and-place robotics and conveyors.",
  website: "https://www.giantdirect.com", linkedin: "https://www.linkedin.com/showcase/giantdirect/",
  achievements: [
    "Performed routine preventive and predictive maintenance on robotic systems, reducing downtime.",
    "Replaced and configured relays, contactors, power supplies, and circuit breakers.",
    "Diagnosed equipment breakdowns and put corrective actions in place to keep production running.",
    "Assembled, installed, and aligned conveyors, actuators, and fixtures.",
    "Repaired robots and automated machinery: gearboxes, belts, and bearings.",
    "Maintained robot safety systems: light curtains, safety gates, and emergency stops.",
  ],
  people: [["MR", "Maria R. (sample)", "Swisslog robotics technician · trained you"], ["DK", "Dan K. (sample)", "Integrated systems technician"]],
  photos: [COVER, COVER, COVER],
};
let ROLE = GIANTS, roleIndex = 0;
// Every other role in the list: what the list knows, nothing else saved yet, so empty states show.
function bareRole([company, title, dates]) {
  const current = /Present/.test(dates);
  const places = { "Sharp Packaging": "Allentown, PA", "Waters Corp. TA Instruments": "New Castle, DE", "Temple University": "Philadelphia, PA", "Rowa Group LLC": "Croydon, PA", "Amazon": "Philadelphia, PA" };
  return { cover: null, story: false, years: false, company, title, place: places[company] || "", dates, current, tenure: "", summary: "", website: "", linkedin: "", achievements: [], people: [], photos: [] };
}
const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const SECTIONS = [
  ["achievements", "Achievements", () => ROLE.achievements.length, "6 things you did here"],
  ["people", "Worked with", () => ROLE.people.length, "Who can vouch for it"],
  ["photos", "Photos & events", () => ROLE.photos.length, "Your shots from the floor"],

}

  document.getElementById("recent").innerHTML = layout === "d" ? historyPanel() : three ? recentPanel() : "";
  document.getElementById("main").innerHTML = layout === "d" ? layoutD() : layout === "r" ? layoutR() : layout === "s" ? layoutS() : layout === "a" ? layoutA() : layout === "b" ? layoutB() : layoutC();
}
document.addEventListener("click", (e) => {

  if (l) { layout = l.dataset.layout; overlay = null; open = layout === "r" || layout === "s" || layout === "d" ? "overview" : "achievements"; document.querySelectorAll("[data-layout]").forEach((b) => b.setAttribute("aria-pressed", String(b === l))); return render(); }
  const rr = e.target.closest("[data-role]");

    overlay = null;
    if (open === "edit") open = "overview";
    openYears = new Set(ROLE.years ? ["2026"] : [(ROLE.dates.match(/\d{4}/) || [""])[0]]);
    history.replaceState(null, "", `#role=${slug(ROLE.company)}`);

  }
  const hf = e.target.closest("[data-hfilter]");

  const ov = e.target.closest("[data-overlay]");
  if (ov) { overlay = overlay === ov.dataset.overlay ? null : ov.dataset.overlay; return render(); }
  if (e.target.matches("[data-overlay-close]") || e.target.closest("button[data-overlay-close]")) { overlay = null; return render(); }
  if (overlay === "people" && !e.target.closest(".pop")) { overlay = null; render(); }
  const hv = e.target.closest("[data-hview]");
  if (hv) { historyView = hv.dataset.hview; return render(); }
  const yr = e.target.closest("[data-year]");

  const rt = e.target.closest("[data-recent]");
  if (rt) { recentTab = rt.dataset.recent; return render(); }
  const o = e.target.closest("[data-open]");
  if (o) { open = o.dataset.open; render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && overlay) { overlay = null; render(); } });
